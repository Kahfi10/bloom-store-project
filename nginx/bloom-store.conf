# Nginx configuration — Bloom Store
# Simpan sebagai: /etc/nginx/sites-available/bloom-store
# Aktifkan dengan: sudo ln -s /etc/nginx/sites-available/bloom-store /etc/nginx/sites-enabled/
# Ganti DOMAIN_KAMU dengan subdomain DuckDNS kamu

server {
    listen 80;
    server_name DOMAIN_KAMU.duckdns.org www.DOMAIN_KAMU.duckdns.org;

    # Setelah dapat SSL dari Certbot, bagian ini akan diatur ulang otomatis
    location / {
        proxy_pass         http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Serve static assets langsung dari Nginx (lebih cepat)
    location /_next/static/ {
        alias /var/www/bloom-store/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        alias /var/www/bloom-store/public/assets/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Limit upload size (untuk upload gambar)
    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
}
