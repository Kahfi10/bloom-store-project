# Nginx configuration — Bloom Store (Multi-Site VPS Ready)
# Domain: bloom-store.duckdns.org
# Reverse Proxy ke Node.js PM2 port 3002

# Rate limiting zone: 10 req/sec per IP with 10MB memory zone
limit_req_zone $binary_remote_addr zone=bloom_api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=bloom_login_limit:10m rate=2r/s;

# ── 1. HTTP Redirect ke HTTPS ───────────────────────────────────────────────
server {
    listen 80;
    server_name bloom-store.duckdns.org www.bloom-store.duckdns.org;

    # Hide Nginx version
    server_tokens off;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 2. HTTPS Server (Port 443) ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name bloom-store.duckdns.org www.bloom-store.duckdns.org;

    # Hide Nginx version
    server_tokens off;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/bloom-store.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bloom-store.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Rate limiting for sensitive login endpoints ─────────────────────
    location ~* ^/(api/auth/login|api/admin/login) {
        limit_req zone=bloom_login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── General API rate limiting ───────────────────────────────────────
    location /api/ {
        limit_req zone=bloom_api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Main Next.js App ────────────────────────────────────────────────
    location / {
        proxy_pass         http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Serve Next.js static assets with prefix priority (^~) and proxy fallback to prevent 404 during rebuilds
    location ^~ /_next/static/ {
        alias /var/www/bloom-store/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ @nextjs_static_fallback;
    }

    location @nextjs_static_fallback {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /assets/ {
        alias /var/www/bloom-store/public/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri $uri/ @nextjs_static_fallback;
    }

    # Limit upload size
    client_max_body_size 10M;

    # ── Block access to source maps and sensitive hidden files (Poin 16) ──
    location ~* (\.map$|\.env|\.git|\.db|\.sqlite|\.bak) {
        deny all;
        return 404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml application/xml application/x-font-ttf font/opentype;
}
